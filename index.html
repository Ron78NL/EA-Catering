<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 Learning Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🎓 Learning Hub</h1>

    <p>Zoek en bekijk video's</p>

    <input
        id="searchInput"
        type="text"
        placeholder="🔍 Zoek een video..."
    >

    <div id="videoGrid" class="video-grid"></div>

    <script>

        const videos = [

            {
                title: "Instructie Reduceren van Bouillon",
                id: "AZdPYo1RWfQ"
            },

            {
                title: "Instructie Degraisseren van Bouillon",
                id: "ABYB6CxNeVo"
            },

            {
                title: "Instructie Arrosseren",
                id: "KfdiOrQkN4U"
            },

            {
                title: "Instructie Aanbraden",
                id: "KD_NEiQ8Lj4"
            },

            {
                title: "Instructie Vacumeren",
                id: "KcJeU7aODPY"
            }

        ];

        const videoGrid = document.getElementById("videoGrid");

        function toonVideos(lijst) {

            videoGrid.innerHTML = "";

            lijst.forEach(video => {

                videoGrid.innerHTML += `
                    <div class="video-card">
                        <a href="https://www.youtube.com/watch?v=${video.id}" target="_blank">
                            <img
                                src="https://img.youtube.com/vi/${video.id}/maxresdefault.jpg"
                                alt="${video.title}">
                            <h3>${video.title}</h3>
                        </a>
                    </div>
                `;

            });

        }

        toonVideos(videos);

        document
            .getElementById("searchInput")
            .addEventListener("keyup", function() {

                const zoekterm = this.value.toLowerCase();

                const gefilterd = videos.filter(video =>
                    video.title.toLowerCase().includes(zoekterm)
                );

                toonVideos(gefilterd);

            });

    </script>

</body>
</html>
