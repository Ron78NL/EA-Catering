<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🎓 Learning Hub</h1>

    <p>Welkom op mijn eerste leerplatform.</p>

    <input
        id="searchInput"
        type="text"
        placeholder="🔍 Zoek een video..."
    >

    <div class="video-grid">

        <div class="video-card">
            <a href="https://www.youtube.com/watch?v=Rt9tW3cMLhI" target="_blank">
                <img src="https://img.youtube.com/vi/Rt9tW3cMLhI/hqdefault.jpg" alt="Video">
                <h3>Olivia Rodrigo</h3>
            </a>
        </div>

        <div class="video-card">
            <a href="https://www.youtube.com/watch?v=v1t4MTqdfyI" target="_blank">
                <img src="https://img.youtube.com/vi/v1t4MTqdfyI/hqdefault.jpg" alt="Video">
                <h3>Ariana Grande</h3>
            </a>
        </div>

    </div>

    <script>
        const zoekbalk = document.getElementById('searchInput');

        zoekbalk.addEventListener('keyup', function () {

            const zoekterm = zoekbalk.value.toLowerCase();
            const videos = document.querySelectorAll('.video-card');

            videos.forEach(function(video) {

                const titel =
                    video.querySelector('h3').textContent.toLowerCase();

                if (titel.includes(zoekterm)) {
                    video.style.display = 'block';
                } else {
                    video.style.display = 'none';
                }

            });

        });
    </script>

</body>
</html>
