<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🎓 Learning Hub</h1>

    <p>Welkom op mijn eerste leerplatform.</p>

    <input
        type="text"
        placeholder="Zoek een video..."
    >

    <div class="video-card">

        <h3>Olivia Rodrigo</h3>

        <iframe
            width="100%"
            height="315"
            src="https://www.youtube.com/embed/Rt9tW3cMLhI"
            title="Olivia Rodrigo"
            frameborder="0"
            allowfullscreen>
        </iframe>

    </div>

    <br>

    <div class="video-card">

        <h3>Ariana Grande</h3>

        <iframe
            width="100%"
            height="315"
            src="https://www.youtube.com/embed/v1t4MTqdfyI"
            title="Ariana Grande"
            frameborder="0"
            allowfullscreen>
        </iframe>

    </div>
<script>
document.addEventListener("DOMContentLoaded", function () {

  const zoekbalk = document.querySelector("input");

  zoekbalk.addEventListener("keyup", function () {

    const zoekterm = zoekbalk.value.toLowerCase();
    const videos = document.querySelectorAll(".video-card");

    videos.forEach(video => {

      const titel = video.querySelector("h3").textContent.toLowerCase();

      if (titel.includes(zoekterm)) {
        video.style.display = "block";
      } else {
        video.style.display = "none";
      }

    });

  });

});
</script>

</body>
</html>
