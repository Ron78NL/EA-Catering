<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video's</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Video's</h1>
</header>

<main>
    <input type="search" id="zoekveld" placeholder="Zoek op titel…" aria-label="Zoeken">

    <nav id="categorieen" aria-label="Categorieën"></nav>

    <p id="aantal" aria-live="polite"></p>

    <ul id="lijst"></ul>
</main>

<!-- Pop-up met de video -->
<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitel">
    <div class="modal-venster">
        <div class="modal-kop">
            <h2 id="modalTitel"></h2>
            <button type="button" id="sluit">Sluiten ✕</button>
        </div>
        <div class="video">
            <iframe id="modalVideo"
                    title="Video"
                    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                    allowfullscreen></iframe>
        </div>
    </div>
</div>

<script src="videos.js"></script>
<script src="app.js"></script>
</body>
</html>
