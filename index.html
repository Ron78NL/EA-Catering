let geselecteerdeCategorie = "";

document
.querySelectorAll(".cat-btn")
.forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll(".cat-btn")
            .forEach(btn =>
                btn.classList.remove("active")
            );

        button.classList.add("active");

        geselecteerdeCategorie =
            button.dataset.category;

        filterVideos();

    });

});
function toonVideos(lijst) {

    videoGrid.innerHTML = "";

    lijst.forEach(video => {

        const card = document.createElement("div");
        card.className = "video-card";

        const link = document.createElement("a");
        link.href = `https://www.youtube.com/watch?v=${video.id}`;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const image = document.createElement("img");
        image.src = `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`;
        image.alt = video.title;

        image.onerror = function() {
            this.src = `https://img.youtube.com/vi/${video.id}/default.jpg`;
        };

        const title = document.createElement("h3");
        title.textContent = video.title;

        link.appendChild(image);
        link.appendChild(title);

        card.appendChild(link);

        videoGrid.appendChild(card);

    });

}
function filterVideos() {

    const zoekterm =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const gefilterd = videos.filter(video => {

        const titelMatch =
            video.title.toLowerCase().includes(zoekterm);

const categorieMatch =
    geselecteerdeCategorie === "" ||

    categories[geselecteerdeCategorie]
        ?.includes(video.id);

return titelMatch && categorieMatch;

    });

    toonVideos(gefilterd);

document.getElementById("resultCount").textContent =
    `${gefilterd.length} video('s) gevonden`;

}

toonVideos(videos);
